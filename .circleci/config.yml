version: 2.1
jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.5-node
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Node dependencies
          command: sudo npm install -g firebase-tools
      - run:
          name: Deploy
          command: |
            echo $FIREBASE_SERVICE_ACCOUNT > credentials.json
            GOOGLE_APPLICATION_CREDENTIALS=credentials.json firebase target:apply hosting AboutMe aboutme-c2b58 d3icidal.com
          
workflows:
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only: master